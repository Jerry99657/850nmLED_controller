<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>850nm 控制板</title>
<style>
  :root { --bg:#111; --card:#1d1d1d; --fg:#eee; --dim:#999; --acc:#e53935; --ok:#43a047; --warn:#fb8c00; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:18px; margin:0 0 12px; }
  .card { background:var(--card); border-radius:10px; padding:14px; margin-bottom:12px; }
  .big { font-size:44px; font-weight:600; text-align:center; margin:4px 0; }
  .bar { height:10px; border-radius:5px; background:#333; position:relative; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--acc); }
  .bar b { position:absolute; top:0; bottom:0; width:2px; background:#fff; }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:15px; margin-top:12px; }
  .grid span:nth-child(odd) { color:var(--dim); }
  .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:13px; background:#333; }
  .tag.run { background:var(--acc); } .tag.fault { background:var(--warn); color:#000; }
  label { display:block; color:var(--dim); font-size:14px; margin-bottom:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=range] { flex:1; }
  input[type=number] { width:80px; font-size:18px; padding:6px; border-radius:6px; border:1px solid #444; background:#000; color:var(--fg); }
  button { font-size:16px; padding:10px 14px; border:0; border-radius:8px; background:#333; color:var(--fg); }
  button.primary { background:var(--ok); } button.stop { background:var(--acc); width:100%; font-size:20px; padding:14px; }
  .quick button { flex:1; padding:8px 0; }
  #msg { min-height:20px; font-size:14px; color:var(--warn); text-align:center; }
  .note { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<h1>850nm 红外控制板 <span id="state" class="tag">--</span></h1>

<div class="card">
  <div class="big" id="pwm">--</div>
  <div class="bar"><i id="fill" style="width:0"></i><b id="lim" style="left:100%"></b></div>
  <div class="grid">
    <span>设定</span><span id="set">--</span>
    <span>上限</span><span id="limit">--</span>
    <span>VBUS</span><span id="vbus">--</span>
    <span>温度</span><span id="temp">--</span>
    <span>保护</span><span id="prot">--</span>
    <span>LED驱动</span><span id="drv">--</span>
    <span>定时</span><span id="timer">--</span>
  </div>
</div>

<div class="card">
  <label>占空比（%）</label>
  <div class="row">
    <input type="range" id="dutyR" min="0" max="100" step="1" value="0">
    <input type="number" id="dutyN" min="0" max="100" step="1" value="0">
  </div>
  <div class="row quick" style="margin-top:10px">
    <button data-d="5">5</button><button data-d="10">10</button><button data-d="25">25</button>
    <button data-d="50">50</button><button data-d="100">100</button>
  </div>
  <div class="row" style="margin-top:10px"><button class="primary" id="setDuty" style="flex:1">设定占空比</button></div>
</div>

<div class="card">
  <label>定时关断（分钟，输出开启后有效）</label>
  <div class="row">
    <input type="number" id="minN" min="1" max="999" step="1" value="10">
    <button class="primary" id="startT" style="flex:1">开始定时</button>
    <button id="cancelT">取消</button>
  </div>
</div>

<div class="card" id="tCard" hidden>
  <label>过温关断温度（℃）——温度到达此值立即关断，掉电保存</label>
  <div class="row">
    <button id="tDown" style="flex:1;font-size:22px">−</button>
    <div id="tempC" style="flex:1;text-align:center;font-size:26px;font-weight:600">--</div>
    <button id="tUp" style="flex:1;font-size:22px">＋</button>
  </div>
  <p class="note" style="margin:10px 0 0">可调范围 <span id="tRange">--</span>（下限跟着板上的预警温度走，
    预警调高了这里也跟着抬）。调低到当前温度以下会立刻关断；温度降下来之后会按关断前的设定值
    自己恢复输出，定时接着走。觉得板子太烫就往下调，但别调得太接近正常工作的温度。<br>
    预警温度和恢复温度只能在板子的“设置”页里改，本页和手机 App 不提供。</p>
</div>

<button class="stop" id="stop">停止输出</button>
<div id="msg"></div>
<p class="note">850 nm 红外光肉眼几乎不可见，请勿直视发光面，以本页或板上红色状态灯判断是否在输出。设定占空比会让板子自动进入“运行”页；板上离开运行页、故障或定时到时都会立即归零。</p>

<script>
const $ = id => document.getElementById(id);
const ERR = { locked: '故障锁定或阶梯测试中，无法输出', not_running: '请先设定占空比开启输出，再开始定时',
              busy: '板子界面忙，请重试', timeout: '板子无响应', bad_arg: '参数错误' };
const FAULT = { 1: '温度传感器故障', 2: '过温关断', 3: 'LED驱动配置失败' };
// 过温是自动恢复的：降温后按关断前的设定值接着输出，这里说明一下
const FAULT_ROW = { 2: '过温关断，降温后恢复输出' };
const DRV = ['无供电（仅下载口）', '配置中', '已配置 5 路', '配置失败'];
let editing = 0;

// 过温关断阈值：本地先改显示，停手 250 ms 再发一条（连点 +/- 不会打满命令队列）
let shut = 0, shutMin = 0, shutMax = 0, shutTouched = 0, shutTimer = 0;

const pct = v => (v % 10 ? (v / 10).toFixed(1) : v / 10) + '%';
const mmss = s => { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
function msg(t) { $('msg').textContent = t || ''; }

async function call(path) {
  try {
    const r = await fetch(path, { method: 'POST' });
    const j = await r.json();
    msg(j.ok ? '' : (ERR[j.err] || j.err));
  } catch (e) { msg('连接失败'); }
  poll();
}

async function poll() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    $('pwm').textContent = pct(s.pwm);
    $('fill').style.width = s.pwm / 10 + '%';
    $('lim').style.left = 'calc(' + s.limit / 10 + '% - 2px)';
    $('set').textContent = pct(s.set);
    $('limit').textContent = pct(s.limit);
    $('vbus').textContent = !s.vbus.ok ? '--' : (s.vbus.v9 ? '9V' : '5V') + '（' +
      (s.vbus.sat ? '>' : '') + (s.vbus.mv / 1000).toFixed(1) + 'V）';
    $('temp').textContent = s.temp === null ? '--' : s.temp.toFixed(1) + ' ℃';
    $('prot').textContent = !s.protect ? '已关闭' : s.fault ? (FAULT_ROW[s.fault] || FAULT[s.fault]) : (s.warn ? '温度预警' : '正常');
    $('drv').textContent = DRV[s.driver] || '--';
    $('timer').textContent = s.timer.on ? '剩余 ' + mmss(s.timer.left) : '未开启';
    const st = $('state');
    if (s.fault) { st.textContent = FAULT[s.fault]; st.className = 'tag fault'; }
    else if (s.demo) { st.textContent = '阶梯测试'; st.className = 'tag'; }
    else if (s.pwm) { st.textContent = '输出中'; st.className = 'tag run'; }
    else { st.textContent = '待机'; st.className = 'tag'; }
    $('dutyR').max = $('dutyN').max = s.limit / 10;
    if (Date.now() - editing > 3000) { $('dutyR').value = $('dutyN').value = Math.round(s.set / 10); }

    // 旧固件的状态字节里没有这一项（shut 为 0），直接不显示这张卡
    shutMin = s.shut_min || 0; shutMax = s.shut_max || 0;
    $('tCard').hidden = !(shutMin > 0 && shutMax > shutMin);
    if (!$('tCard').hidden) {
      if (Date.now() - shutTouched > 3000) { shut = s.shut; }
      $('tempC').textContent = shut + ' ℃';
      $('tRange').textContent = shutMin + ' ~ ' + shutMax;
      $('tDown').disabled = shut <= shutMin;
      $('tUp').disabled = shut >= shutMax;
    }
  } catch (e) { $('state').textContent = '未连接'; $('state').className = 'tag'; }
}

$('dutyR').oninput = () => { editing = Date.now(); $('dutyN').value = $('dutyR').value; };
$('dutyN').oninput = () => { editing = Date.now(); $('dutyR').value = $('dutyN').value; };
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => {
  editing = Date.now(); $('dutyR').value = $('dutyN').value = b.dataset.d; });
$('setDuty').onclick = () => { editing = 0; call('/api/duty?pct=' + Math.max(0, Math.min(100, +$('dutyN').value | 0))); };
$('startT').onclick = () => { const m = +$('minN').value | 0;
  if (m < 1 || m > 999) { msg('定时范围 1~999 分钟'); return; } call('/api/timer?min=' + m); };
$('cancelT').onclick = () => call('/api/timer?min=0');

function shutStep(d) {
  shut = Math.max(shutMin, Math.min(shutMax, shut + d));
  shutTouched = Date.now();
  $('tempC').textContent = shut + ' ℃';
  $('tDown').disabled = shut <= shutMin;
  $('tUp').disabled = shut >= shutMax;
  clearTimeout(shutTimer);
  shutTimer = setTimeout(() => { shutTouched = Date.now(); call('/api/temp?c=' + shut); }, 250);
}
$('tDown').onclick = () => shutStep(-1);
$('tUp').onclick = () => shutStep(1);
$('stop').onclick = () => { editing = 0; call('/api/stop'); };

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
